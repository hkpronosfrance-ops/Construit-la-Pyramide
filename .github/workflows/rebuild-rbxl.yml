name: Rebuild full Roblox place snapshot

on:
  push:
    branches:
      - import/full-place-snapshot
    paths:
      - 'place/.transport/READY'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/full-place-snapshot
          fetch-depth: 0

      - name: Reconstruct exact RBXL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p place
          cat place/.transport/part-* > /tmp/buildapiramid.rbxl.xz.b64
          base64 --decode /tmp/buildapiramid.rbxl.xz.b64 > /tmp/buildapiramid.rbxl.xz
          xz --decompress --stdout /tmp/buildapiramid.rbxl.xz > place/buildapiramid.rbxl
          echo "8ed8a1315d2a69fffa87a1e81c0bac8f44e8d3a2f50b780175d7de1197ec5e50  place/buildapiramid.rbxl" | sha256sum --check -
          test "$(stat -c%s place/buildapiramid.rbxl)" = "609084"

      - name: Commit verified binary snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf place/.transport
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add place/buildapiramid.rbxl place/.transport
          git commit -m "assets: add complete original Roblox place snapshot"
          git push origin HEAD:import/full-place-snapshot
